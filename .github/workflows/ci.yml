name: CI

on:
  push:
    branches: [PC_Daniel_Mesh, main]
  pull_request:
    branches: [main]

env:
  HIGTREE_DIR: ${{ github.workspace }}/higtree
  HIGFLOW_DIR: ${{ github.workspace }}/higflow

jobs:
  lint:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/antoniocastelofilho/HigFlow/higflow-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        continue-on-error: true
        run: markdownlint-cli2 AGENTS.md higflow/*/README.md || true
      - name: C code style
        continue-on-error: true
        run: |
          find . -name '*.c' -not -path '*/bibliotecas/*' \
            -exec clang-format --dry-run -Werror --style=gnu {} + || true
      - name: Python lint
        continue-on-error: true
        run: |
          find . -name '*.py' -not -path '*/bibliotecas/*' \
            -exec pylint --errors-only {} + || true

  # A suite constroi o que precisa e roda cada caso em varias contagens de
  # processos contra uma unica referencia.  Separar 2D e 3D em dois jobs nao e'
  # cosmetico: os objetos em higflow/src nao levam a dimensao no nome, entao um
  # mesmo checkout so pode ter um DIM construido de cada vez.
  regression-2d:
    needs: lint
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/antoniocastelofilho/HigFlow/higflow-ci:latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression suite (2D)
        run: |
          python3 ci/run_suite.py --np 1,2,3 \
            --case example2d_Newt \
            --case example2d_Newt_contraction \
            --case example2d_Oldroyd \
            --case example2d_Gptt \
            --case example2d_VOF \
            --case example2d_VOF_Gptt \
            --case example2d_VOF_Oldroyd

  regression-3d:
    needs: lint
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/antoniocastelofilho/HigFlow/higflow-ci:latest
    steps:
      - uses: actions/checkout@v4
      # O limite de processos e' por caso, no manifesto: a malha do lid-driven
      # e' grosseira demais para dividir, entao a suite roda em um processo e
      # registra o motivo em vez de afrouxar a tolerancia.
      - name: Regression suite (3D)
        run: |
          python3 ci/run_suite.py --np 1,2,3 --case example3d_lid_driven
