name: verification

# Two jobs with very different costs, so they run on different triggers.
#
# `selftest` needs only Python and numpy and finishes in seconds, so it runs on
# every push and every pull request. It checks the verification suite against
# things that are true by construction, which is what makes the expensive job
# worth trusting when it does run.
#
# `channel` builds the container and runs the solver. PETSc alone takes tens of
# minutes, so it runs on pushes to the main branches, on pull requests that
# touch the solver, and on demand. Putting it on every push would make the
# queue useless without catching anything the cheap job misses on a docs edit.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: verification suite self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: python -m pip install --disable-pip-version-check numpy

      - name: Self-check
        run: python tests/verification/selftest.py

      - name: Through CTest
        run: |
          cmake -S tests -B build-tests
          ctest --test-dir build-tests -R verification_selftest --output-on-failure

  channel:
    name: plane channel against the exact solution
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Skipped on pull requests that change nothing the solver compiles or runs.
    if: >
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'docs-only')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image is four stages and the first three change rarely, so caching
      # them is the difference between a 90 minute job and a 10 minute one.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          tags: higflow:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the case and check it
        env:
          # The runner defaults to a mktemp directory. Fixing it here is what
          # lets the output be kept when a check fails, which is the run worth
          # looking at.
          HIGFLOW_TEST_WORK: ${{ github.workspace }}/verification-run
        run: bash tests/run_verification.sh

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-run
          path: |
            verification-run/example2d_Newt/VTKS/
            verification-run/run.log
          retention-days: 7
          if-no-files-found: ignore
