# HigFlow - compose services
#
# Run from the REPOSITORY ROOT:
#     docker compose -f containers/docker-compose.yml run --rm shell
#
# The build context is `..` so the whole repository is available; the root
# .dockerignore keeps out what the image does not need.
#
# There is no `version:` key. Compose v2 ignores it and warns when it is
# present.

name: higflow

# Settings every service shares. MPI inside a container needs more shared
# memory than the 64 MB default: OpenMPI's shared-memory transport allocates
# from /dev/shm, and a parallel run that exhausts it fails with an error about
# vader or shm that looks nothing like the real cause.
x-common: &common
  build:
    context: ..
    dockerfile: containers/Dockerfile
  image: higflow:latest
  shm_size: 1gb
  volumes:
    - ../cases:/work
  working_dir: /work

services:

  # Build the image and stop. Useful on its own: `docker compose ... build`
  # warms the layer cache before anyone needs to run something.
  build:
    <<: *common
    command: ["info"]

  # Interactive shell in /work.
  shell:
    <<: *common
    command: ["shell"]
    stdin_open: true
    tty: true

  # What the image contains and which toolchain built it.
  info:
    <<: *common
    command: ["info"]

  # Example cases compiled into the image.
  examples:
    <<: *common
    command: ["examples"]

  # Run an example. Override the case and rank count on the command line:
  #     docker compose -f containers/docker-compose.yml \
  #         run --rm case example2d_Newt 4
  case:
    <<: *common
    entrypoint: ["/usr/local/bin/entrypoint.sh", "case"]
    command: ["example2d_Newt", "1"]

  # Development image: debugger, profiler and language server, with the
  # repository mounted live at /src rather than copied in, so an edit on the
  # host is visible to the container without rebuilding.
  dev:
    build:
      context: ..
      dockerfile: containers/Dockerfile.dev
    image: higflow:dev
    shm_size: 1gb
    volumes:
      - ..:/src
      - ../cases:/work
    working_dir: /src
    stdin_open: true
    tty: true
    # ptrace is what gdb and valgrind need to attach to a process. Docker
    # blocks it by default.
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: ["bash"]
